services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pral
      POSTGRES_USER: pral
      POSTGRES_PASSWORD: pral
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - ./apps/backend:/var/www
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pral
      DB_USERNAME: pral
      DB_PASSWORD: pral
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - mailpit
    command: php artisan serve --host=0.0.0.0 --port=8000

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  pgdata:
